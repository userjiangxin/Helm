# Development stack. Production notes: docs/m0-tasks.md task S4.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
      POSTGRES_DB: helm
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
